      /* Splash crítico com a assinatura Dark Room. Substrato Preto Fita Magnética (#090A0C),
         logo oficial (public/brand/dark-room-logo.svg) e texto em JetBrains Mono #8F9397.
         src/lib/bootSplash.ts tira o bloco de #root antes do React e faz o fade de saída. */
      #initial-loader { position: fixed; inset: 0; background: #090A0C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; z-index: 9999; transition: opacity 360ms cubic-bezier(0.22, 1, 0.36, 1); padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
      #initial-loader.is-leaving { opacity: 0; pointer-events: none; }
      #initial-loader .dr-logo { width: min(56vw, 260px); height: auto; }
      #initial-loader .dr-boot { display: flex; flex-direction: column; align-items: center; gap: 12px; animation: dr-in 700ms 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      #initial-loader .dr-bar { position: relative; width: 96px; height: 1px; background: #24262B; overflow: hidden; }
      #initial-loader .dr-bar::after { content: ""; position: absolute; inset: 0; width: 32%; background: #8F9397; animation: dr-scan 1.3s linear infinite; }
      #initial-loader .dr-text { color: #8F9397; font-family: "JetBrains Mono", ui-monospace, "Courier New", monospace; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; }
      @keyframes dr-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes dr-scan { from { transform: translateX(-100%); } to { transform: translateX(320%); } }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader, #initial-loader .dr-boot { animation: none; transition: none; }
        #initial-loader .dr-bar::after { animation: none; width: 100%; opacity: 0.4; }
      }
    </style>
