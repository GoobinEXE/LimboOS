<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LimboOS capa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tape: #090A0C;
    --bone: #EDE6DA;
    --ash: #8F9397;
    --ash-dim: #5B5F63;
    --amber: #FF8C00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; background: var(--tape); overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, system-ui, sans-serif;
    background:
      radial-gradient(ellipse 520px 420px at 930px 360px, rgba(255, 140, 0, 0.16), transparent 70%),
      radial-gradient(ellipse 900px 500px at 200px 700px, rgba(70, 60, 48, 0.35), transparent 70%),
      linear-gradient(180deg, #0d0e10 0%, var(--tape) 100%);
  }
  /* Linhas de CRT bem leves */
  body::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .fenda {
    position: absolute; left: 905px; top: 40px; width: 3px; height: 560px;
    background: linear-gradient(180deg, transparent, rgba(255,140,0,0.75) 30%, rgba(255,190,90,0.9) 50%, rgba(255,140,0,0.75) 70%, transparent);
    filter: blur(1.5px);
    transform: skewX(-6deg);
    opacity: 0.55;
  }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .studio { height: 26px; width: auto; margin-bottom: 44px; opacity: 0.9; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 104px; letter-spacing: -0.035em; line-height: 0.95; color: var(--bone); }
  h1 span { color: var(--amber); }
  .line { margin-top: 26px; font-size: 23px; line-height: 1.4; color: #C9C2B6; max-width: 470px; }
  .devices { margin-top: 34px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12.5px; letter-spacing: 0.24em; color: var(--ash); text-transform: uppercase; }
  .devices b { color: var(--amber); font-weight: 700; }
  .phone {
    position: absolute; border-radius: 26px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06);
    background: #000;
  }
  .phone img { display: block; width: 100%; height: auto; }
  .p-left  { width: 236px; left: 640px;  top: 92px;  transform: rotate(-4deg); filter: brightness(0.8); }
  .p-mid   { width: 272px; left: 800px;  top: 30px;  z-index: 2; }
  .p-right { width: 236px; left: 1000px; top: 96px;  transform: rotate(4deg); z-index: 1; filter: brightness(0.92); }
</style>
</head>
<body>
  <div class="fenda"></div>
  <div class="copy">
    <!--DARK_ROOM_LOGO-->
    <h1>Limbo<span>OS</span></h1>
    <p class="line">Companion de campanha para RPG de mesa. O mestre libera a Intel, o agente recebe no aparelho.</p>
    <p class="devices">Walkman <b>·</b> Nokia <b>·</b> MH-DOS <b>·</b> Win95 <b>·</b> Mac OS</p>
  </div>
  <div class="phone p-left"><img src="../../docs/readme/screens/jogador-campanhas.webp" alt=""></div>
  <div class="phone p-mid"><img src="../../docs/readme/screens/walkman-fita.webp" alt=""></div>
  <div class="phone p-right"><img src="../../docs/readme/screens/nokia-correio.webp" alt=""></div>
</body>
</html>
