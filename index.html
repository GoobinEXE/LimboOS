<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LimboOS</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    </noscript>
  </head>
  <body>
    <div id="root">
      <style>
        /* Splash crítico: espelha os tokens de src/index.css (surface #131313, accent #FF8C00) */
        :root {
          --boot-surface: #131313;
          --boot-surface-bright: #393939;
          --boot-accent: #FF8C00;
          --boot-vignette-strength: 0.55;
          --boot-font-mono: "JetBrains Mono", ui-monospace, "Courier New", monospace;
          --boot-ease: cubic-bezier(0.22, 1, 0.36, 1);
        }
        #initial-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--boot-surface); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #initial-loader::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,calc(var(--boot-vignette-strength) * 0.45)) 76%, rgba(0,0,0,var(--boot-vignette-strength)) 100%); }
        .r-spin-wrap { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; }
        .r-spin-bg { position: absolute; inset: 0; border: 4px solid var(--boot-surface-bright); border-radius: 50%; }
        .r-spin-track { position: absolute; inset: -4px; border: 4px solid transparent; border-top-color: var(--boot-accent); border-radius: 50%; animation: r-spin 1s linear infinite; }
        .r-spin-dot { width: 8px; height: 8px; background: var(--boot-accent); border-radius: 50%; box-shadow: 0 0 12px -2px rgba(255,140,0,0.35); animation: r-pulse 2s var(--boot-ease) infinite; }
        @keyframes r-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes r-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        .r-text { position: relative; z-index: 1; color: var(--boot-accent); font-family: var(--boot-font-mono); font-size: 12px; letter-spacing: 0.3em; margin-top: 24px; text-transform: uppercase; font-weight: 700; font-variant-numeric: tabular-nums; animation: r-pulse 2s var(--boot-ease) infinite; }
        @media (prefers-reduced-motion: reduce) {
          .r-spin-track { animation-duration: 2s; }
          .r-spin-dot, .r-text { animation: none; }
        }
      </style>
      <div id="initial-loader">
        <div class="r-spin-wrap">
          <div class="r-spin-bg"><div class="r-spin-track"></div></div>
          <div class="r-spin-dot"></div>
        </div>
        <div class="r-text">INICIALIZANDO...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
